# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/site"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@pureform/panda-adapter"
    - "@pureform/preset"
    - "@pureform/solid"
    - "@pureform/js-effects"
    - "@pureform/styling"
    - "@pureform/styling-web"
    - "@pureform/generate"
    - "@pureform/bundler"
    - "@pureform/cli"
    - "@pureform/material"
    - "@pureform/theme"
    - "@pureform/core"
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"

cache:
  key:
    files:
      append:
        - panda.config.ts
        - panda.pureform.ts
        - pureform.config.ts
        - pureform.codegen.ts
        - vite.config.ts

tasks:
  test:
    enabled: true

  test:unit:
    enabled: false

  test:integration:
    enabled: false

  # A smoke test: the dev server renders the home page, and it hydrates in Chromium.
  test:e2e:
    enabled: true
    cache:
      key:
        files:
          append:
            - "./vitest-e2e-server.ts"
    # Panda's codegen, which the pages import, after the registry.
    dependencies:
      append:
        - prepare

  # `tsconfig.node.json` checks the smoke test's global setup, and both tsconfigs what it provides.
  check:types:
    cache:
      key:
        files:
          append:
            - "./vitest-e2e-server.ts"
            - "./vitest-e2e-context.d.ts"

  # Writes `.pureform/` (ignored by git) from `pureform.config.ts` with the built Panda adapter's
  # codegen, for Panda's codegen and `tsc`; `vite dev` and `vite build` write it themselves.
  generate:
    # Node runs the CLI (as its shebang would), as Vite runs the plugin: the preset computes
    # some values (shape morphs) differently under Bun, which changes the registry's hash.
    exec: node node_modules/@pureform/cli/dist/pureform.mjs generate
    dependencies:
      - ^build
    cache:
      output:
        files:
          - ".pureform/**/*"

  prepare:
    exec: bun x panda codegen
    dependencies:
      - generate

  build:
    enabled: true
    dependencies:
      append:
        - prepare

    cache:
      output:
        files:
          - .vercel/**/*
