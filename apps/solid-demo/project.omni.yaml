# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/site"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@pureform/panda-adapter"
    - "@pureform/preset"
    - "@pureform/solid"
    - "@pureform/js-effects"
    - "@pureform/styling"
    - "@pureform/generate"
    - "@pureform/bundler"
    - "@pureform/material"
    - "@pureform/theme"
    - "@pureform/core"
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"

cache:
  key:
    files:
      append:
        - panda.config.ts
        - panda.pureform.ts
        - pureform.config.ts
        - pureform.glue.ts
        - vite.config.ts
        - "scripts/**/*"

tasks:
  test:
    enabled: false

  test:unit:
    enabled: false

  test:integration:
    enabled: false

  test:e2e:
    enabled: false

  # Writes `.pureform/` (ignored by git) from `pureform.config.ts` with the built Panda adapter's
  # codegen, for Panda's codegen and the tests; `vite dev` and `vite build` write it themselves.
  generate:
    # Under Node, as Vite runs the plugin: the preset computes some values (shape morphs)
    # differently under Bun, which changes the glue's hash.
    exec: node scripts/generate.ts
    dependencies:
      - ^build
    cache:
      output:
        files:
          - ".pureform/**/*"

  prepare:
    exec: bun x panda codegen
    dependencies:
      - generate

  build:
    enabled: true
    dependencies:
      - prepare

    cache:
      output:
        files:
          - .vercel/**/*
