# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/site"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@pureform/panda-adapter"
    - "@pureform/preset"
    - "@pureform/js-effects"
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"

cache:
  key:
    files:
      append:
        - panda.config.ts
        - vite.config.ts

tasks:
  test:
    enabled: false

  test:unit:
    enabled: false

  test:integration:
    enabled: false

  test:e2e:
    enabled: false

  prepare: bun x panda codegen

  build:
    enabled: true
    dependencies:
      - prepare

    cache:
      output:
        files:
          - .vercel/**/*
