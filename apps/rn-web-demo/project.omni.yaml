# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/rn-web-demo"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/react-native"
    - "@pureform/styling"
    - "@pureform/rn-adapter"
    - "@pureform/material"
    - "@pureform/preset"
    - "@pureform/generate"
    - "@pureform/bundler"
    - "@pureform/cli"

cache:
  key:
    files:
      append:
        - pureform.config.ts
        - pureform.codegen.ts
        - vite.config.ts
        - index.html

tasks:
  test:unit:
    enabled: false

  test:integration:
    enabled: false

  # The page in Chromium, from the package over the generated registry.
  test:e2e:
    enabled: true

  test:
    enabled: true

  # Writes `.pureform/` (ignored by git) from `pureform.config.ts` with the built React Native
  # adapter's codegen, for `tsc` without a dev server; `vite dev` and `vite build` write it
  # themselves.
  generate:
    # `bun x` runs the bin under Node (its shebang), as Vite runs the plugin: the preset computes
    # some values (shape morphs) differently under Bun, which changes the registry's hash.
    exec: bun x pureform generate
    dependencies:
      - ^build
    cache:
      output:
        files:
          - ".pureform/**/*"

  build:
    enabled: true
    dependencies:
      append:
        - generate

  publish:
    enabled: false

meta:
  publish: false
