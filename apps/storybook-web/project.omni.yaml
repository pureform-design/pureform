# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/storybook-web"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/solid"
    - "@pureform/react"
    - "@pureform/react-native"
    - "@pureform/rn-adapter"
    - "@pureform/styling"
    - "@pureform/styling-web"
    - "@pureform/anatomy"
    - "@pureform/binding-core"
    - "@pureform/binding-web"
    - "@pureform/component-cases"
    - "@pureform/panda-adapter"
    - "@pureform/preset"
    - "@pureform/material"
    - "@pureform/theme"
    - "@pureform/core"
    - "@pureform/generate"
    - "@pureform/bundler"
    - "@pureform/cli"

cache:
  key:
    files:
      append:
        - panda.config.ts
        - panda.pureform.ts
        - pureform.config.ts
        - pureform.codegen.ts
        - stories.config.ts
        - ".storybook/**/*"

tasks:
  # The codegen's specs (scripts/**/*.spec.ts).
  test:unit:
    enabled: true

  test:integration:
    enabled: false

  # Every story's play test and a11y checks in Chromium, once per renderer (see
  # vitest.config.storybook.ts).
  test:e2e:
    enabled: true
    exec: bun run vitest --config ./vitest.config.storybook.ts run
    dependencies:
      append:
        - generate:stories
        - prepare
    cache:
      key:
        files:
          append:
            - "./vitest.config.storybook.ts"
            - stories.config.ts
            - ".storybook/**/*"

  dev:
    exec: bun x storybook dev -p 6006 --no-open
    dependencies:
      - generate:stories
      - prepare

  # Writes `.pureform/` (ignored) from `pureform.config.ts` with the built Panda adapter's codegen.
  generate:
    # Node runs the CLI, as Vite runs the plugin (see apps/solid-demo).
    exec: node node_modules/@pureform/cli/dist/pureform.mjs generate
    dependencies:
      - ^build

  # Writes `src/stories/generated/` (ignored) from `stories.config.ts`. Node runs the script.
  generate:stories:
    exec: node scripts/generate-stories.ts
    dependencies:
      - ^build
    cache:
      key:
        files:
          append:
            - scripts/**/*
            - src/**/*.ts
      output:
        files:
          - src/stories/generated/**/*

  prepare:
    exec: bun x panda codegen
    dependencies:
      - generate

  build:
    enabled: true
    exec: bun x storybook build
    dependencies:
      append:
        - generate:stories
        - prepare
    cache:
      output:
        files:
          - storybook-static/**/*

  publish:
    enabled: false

meta:
  publish: false
