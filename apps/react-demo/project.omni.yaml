# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/react-demo"

extends:
  - "@workspace/omni/presets/ts-vite-app.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/react"
    - "@pureform/styling"
    - "@pureform/panda-adapter"
    - "@pureform/preset"
    - "@pureform/material"
    - "@pureform/theme"
    - "@pureform/core"
    - "@pureform/generate"
    - "@pureform/bundler"
    - "@pureform/cli"

cache:
  key:
    files:
      append:
        - panda.config.ts
        - panda.pureform.ts
        - pureform.config.ts
        - pureform.codegen.ts
        - vite.config.ts
        - index.html

tasks:
  test:unit:
    enabled: false

  test:integration:
    enabled: false

  # A smoke test: the page in Chromium, from the generated registry and Panda's stylesheet.
  test:e2e:
    enabled: true
    # Panda's codegen, which the page's stylesheet and the config read, after the registry.
    dependencies:
      append:
        - prepare

  test:
    enabled: true

  # Writes `.pureform/` (ignored) from `pureform.config.ts` with the built Panda adapter's codegen.
  generate:
    # Node runs the CLI (as its shebang would), as Vite runs the plugin: the preset computes
    # some values (shape morphs) differently under Bun, which changes the registry's hash.
    exec: node node_modules/@pureform/cli/dist/pureform.mjs generate
    dependencies:
      - ^build

  prepare:
    exec: bun x panda codegen
    dependencies:
      - generate

  build:
    enabled: true
    dependencies:
      append:
        - prepare

  publish:
    enabled: false

meta:
  publish: false
