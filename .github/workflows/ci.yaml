name: CI

on:
  push:
    branches: [main]
    # workspace tags only (v1.2.3), not per-package tags (package-v1.2.3)
    tags:
      - "v*.*.*"
      - "!*-v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Check Commits
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Conventional Commits Check
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
          # only this PR's commits; the repo has no SemVer tag for --from-latest-tag
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          cache-key-prefix: check
          cache-restore-key-prefixes: |
            build
            test

      # Type-aware lint and tsc import the apps' and tests' generated output (`.pureform/`,
      # `styled-system/`), which no check task writes
      - name: Generate
        run: omni -i run -f=failed generate prepare

      - name: Check (format, lint, types)
        run: omni -i run -f=failed check

      - name: Prune stale caches
        run: omni -i cache prune -sy -o="7d"

  build:
    name: Build
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          cache-key-prefix: build
          cache-restore-key-prefixes: |
            check
            test

      - name: Plan build outputs
        id: plan
        run: |
          omni -i run -f=failed -d --result=result.json build
          bun --bun x @omni-oss/create-jobs result.json --output=jobs.json
          echo "jobs=$(jq -c '.build.typescript' jobs.json)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: omni -i run -f=failed build

      - name: Package build outputs
        uses: ./.github/actions/package-jobs-artifacts
        with:
          jobs: ${{ steps.plan.outputs.jobs }}
          name: build

      - name: Prune stale caches
        run: omni -i cache prune -sy -o="7d"

  # Everything but the shards, in topological order. Also plans the shard matrix from the tasks'
  # `meta.ci.shard`.
  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          cache-key-prefix: test
          cache-restore-key-prefixes: |
            build
            check
          install-playwright: "true"

      - name: Plan shards
        id: plan
        run: |
          omni -i run -f=failed -d --result=shards.json -m 'ci.shard == true' 'test:*'
          echo "shards=$(jq -c '[.[] | select(.details.meta.ci.shard == true and .status != "skipped") | {project: .task.project_name, task: .task.task_name, slug: (((.task.project_name | ltrimstr("@")) + "-" + .task.task_name) | gsub("[^A-Za-z0-9._-]"; "-"))}]' shards.json)" >> "$GITHUB_OUTPUT"

      # A filter selects tasks but still runs their dependencies, so the aggregate of a project with
      # shards is marked `ci.shard: parent` and left out here.
      - name: Test
        run: omni -i run -f=failed -m '!ci.shard' test test:unit test:e2e

      - name: Upload Vitest failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failures
          retention-days: 7
          if-no-files-found: ignore
          # `.vitest/` is a hidden directory, skipped unless asked for
          include-hidden-files: true
          path: |
            packages/*/.vitest/attachments
            apps/*/.vitest/attachments
            tests/*/.vitest/attachments

      - name: Prune stale caches
        run: omni -i cache prune -sy -o="7d"

  test-shard:
    name: Test (${{ matrix.project }}#${{ matrix.task }})
    needs: [test]
    if: ${{ needs.test.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          cache-key-prefix: test-shard-${{ matrix.slug }}
          cache-restore-key-prefixes: |
            test
            build
            check
          install-playwright: "true"

      - name: Test
        run: omni -i run -f=failed -p '${{ matrix.project }}' '${{ matrix.task }}'

      - name: Upload Vitest failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failures-${{ matrix.slug }}
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            packages/*/.vitest/attachments
            apps/*/.vitest/attachments
            tests/*/.vitest/attachments

      - name: Prune stale caches
        run: omni -i cache prune -sy -o="7d"

  # Disabled until the PUBLISH_ENABLED repo variable is set to "true" (and a version tag is pushed).
  publish:
    name: Publish
    needs: [test, test-shard]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          cache-key-prefix: publish
          cache-restore-key-prefixes: |
            build
            test

      - name: Publish
        run: omni -i run -f=failed publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The ONLY status check to require in the `main` branch protection / ruleset.
  # Skipped jobs (publish on PRs, commits on pushes) must not fail the gate.
  ci-gatekeeper:
    name: CI Passed
    needs: [commits, check, build, test, test-shard, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate upstream job results
        uses: actions/github-script@v8
        env:
          RESULTS_JSON: |
            {
              "commits": "${{ needs.commits.result }}",
              "check": "${{ needs.check.result }}",
              "build": "${{ needs.build.result }}",
              "test": "${{ needs.test.result }}",
              "test-shard": "${{ needs.test-shard.result }}",
              "publish": "${{ needs.publish.result }}"
            }
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS_JSON);
            const failed = Object.entries(results)
              .filter(([, r]) => r === 'failure' || r === 'cancelled')
              .map(([name, r]) => `${name}: ${r}`);
            for (const [name, r] of Object.entries(results)) core.info(`${name}: ${r}`);
            if (failed.length) core.setFailed(`Upstream jobs did not pass:\n${failed.join('\n')}`);
