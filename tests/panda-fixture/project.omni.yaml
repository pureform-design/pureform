# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/panda-fixture"

extends:
  - "@workspace/omni/presets/ts-vite-test.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/panda-adapter"
    - "@pureform/preset"
    - "@pureform/js-effects"
    - "@pureform/styling"
    - "@pureform/material"
    - "@pureform/theme"
    - "@pureform/core"
    - "@pureform/generate"
    - "@pureform/bundler"
    - "@pureform/cli"

cache:
  key:
    files:
      append:
        - panda.config.ts
        - panda.pureform.ts
        - pureform.config.ts
        - pureform.codegen.ts
        - "src/**/*.css"

tasks:
  # Imports the Panda fixture's and the demos' generated output, which no task here writes.
  check:types:
    enabled: false

  # Writes `.pureform/` (ignored by git) from `pureform.config.ts` with the built Panda adapter's
  # codegen, for Panda's codegen and the suites.
  generate:
    # Node runs the CLI (as its shebang would), as Vite runs the plugin: the preset computes
    # some values (shape morphs) differently under Bun, which changes the registry's hash.
    exec: node node_modules/@pureform/cli/dist/pureform.mjs generate
    dependencies:
      - ^build
    cache:
      output:
        files:
          - ".pureform/**/*"

  # Writes `styled-system/` (ignored by git), which the page and the suites import.
  prepare:
    exec: bun x panda codegen
    dependencies:
      - generate
    cache:
      output:
        files:
          - "styled-system/**/*"

meta:
  publish: false
