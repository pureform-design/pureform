<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fontconfig the e2e Chromium runs with (FONTCONFIG_FILE, vitest.config.e2e.ts), so text in
  the screenshots draws the same on every machine. It reads the system fonts and the standard
  family aliases, but not /etc/fonts/fonts.conf (whose conf.d reads ~/.config/fontconfig) nor
  any user or local config, and it turns hinting and subpixel rendering off for every font.
-->
<fontconfig>
    <dir>/usr/share/fonts</dir>
    <dir>/usr/local/share/fonts</dir>
    <cachedir>/var/cache/fontconfig</cachedir>
    <cachedir prefix="xdg">fontconfig</cachedir>

    <include ignore_missing="yes">/etc/fonts/conf.d/30-metric-aliases.conf</include>
    <include ignore_missing="yes">/etc/fonts/conf.d/45-generic.conf</include>
    <include ignore_missing="yes">/etc/fonts/conf.d/45-latin.conf</include>
    <include ignore_missing="yes">/etc/fonts/conf.d/49-sansserif.conf</include>
    <include ignore_missing="yes">/etc/fonts/conf.d/60-generic.conf</include>
    <include ignore_missing="yes">/etc/fonts/conf.d/60-latin.conf</include>

    <match target="pattern">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>false</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
        <edit name="rgba" mode="assign"><const>none</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
        <edit name="autohint" mode="assign"><bool>false</bool></edit>
        <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    </match>
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>false</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
        <edit name="rgba" mode="assign"><const>none</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
        <edit name="autohint" mode="assign"><bool>false</bool></edit>
        <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    </match>
</fontconfig>
