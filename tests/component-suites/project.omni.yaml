# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/component-suites"

extends:
  - "@workspace/omni/presets/ts-vite-test.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/anatomy"
    - "@pureform/component-cases"
    - "@pureform/styling"
    - "@pureform/styling-web"
    - "@pureform/material"
    - "@pureform/solid"
    - "@pureform/react"
    - "@pureform/generate"
    - "@pureform/css-adapter"
    - "@pureform/tailwind-adapter"
    - "@pureform/panda-fixture"

cache:
  key:
    files:
      append:
        - "./vitest.config.browser.ts"
        - "./.pureform/**/*"
        - "../panda-fixture/.pureform/**/*"
        - "../panda-fixture/panda.config.ts"
        - "../panda-fixture/panda.pureform.ts"
        - "../panda-fixture/pureform.config.ts"
        - "../panda-fixture/pureform.codegen.ts"
        - "../panda-fixture/src/styles.css"
        - "../../tests/browser-e2e-tests/src/mirror.ts"
        # The suites run on the bindings' and machines' sources, not their builds.
        - "../../packages/solid/src/**/*"
        - "../../packages/react/src/**/*"
        - "../../packages/machines/src/**/*"
        - "../../packages/component-cases/src/**/*"

tasks:
  # Imports the Panda fixture's and the demos' generated output, which no task here writes.
  check:types:
    enabled: false

  # Writes the CSS and Tailwind targets' registries (`.pureform/`, ignored by git), which the
  # component and e2e tasks import, and the type-aware lint reads. A task of its own, so the two test
  # tasks, which run at the same time, don't write the same files (and wait on each other's lock).
  generate:
    exec: node scripts/generate-registries.ts
    dependencies:
      - ^build
    cache:
      output:
        files:
          - ".pureform/**/*"

  # CI runs the shard tasks below instead of this aggregate, so its filter leaves the aggregate out:
  # a filter selects tasks, but still runs what they depend on.
  test:
    meta:
      ci:
        shard: parent

  # One Vitest project per binding and target. CI runs the `meta.ci.shard` tasks as a matrix, and the
  # parent task, with no project, runs them all.
  test:component:
    enabled: true
    exec: bun x vitest --config ./vitest.config.component.ts run{% if args.project %} --project {{ args.project }}{% endif %}
    args:
      project: ""
    # The Panda fixture's codegen writes the styled-system the registry and stylesheet import.
    dependencies:
      append:
        - ^prepare
        - generate

  # The server rendering suite and the indication benchmark.
  test:e2e:
    enabled: true
    dependencies:
      append:
        - ^prepare
        - generate

  test:component:solid-panda:
    extends: test:component
    args:
      project: "solid/panda"
    meta:
      ci:
        shard: true

  test:component:solid-css:
    extends: test:component
    args:
      project: "solid/css"
    meta:
      ci:
        shard: true

  test:component:solid-tailwind:
    extends: test:component
    args:
      project: "solid/tailwind"
    meta:
      ci:
        shard: true

  test:component:react-panda:
    extends: test:component
    args:
      project: "react/panda"
    meta:
      ci:
        shard: true

  test:component:react-css:
    extends: test:component
    args:
      project: "react/css"
    meta:
      ci:
        shard: true

  test:component:react-tailwind:
    extends: test:component
    args:
      project: "react/tailwind"
    meta:
      ci:
        shard: true
