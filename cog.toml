from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
# Versioning, as in docs/design/component-architecture.md: the core train is one package,
# `core-train`, so its packages share one version and one tag. Bindings and tooling get
# their own tags. No global tag: cocogitto skips it when no package bumps, and it would
# also count commits to apps, tests, and docs.
generate_mono_repository_global_tag = false
generate_mono_repository_package_tags = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = []
post_bump_hooks = []
# Sets the version in package.json and bun.lock: every train package for `core-train`,
# the package itself otherwise.
pre_package_bump_hooks = [
    "bun \"$(git rev-parse --show-toplevel)/packages/release/src/cli.ts\" set-version {{package}} {{version}}",
]
post_package_bump_hooks = ["git push origin {{version_tag}}"]
tag_prefix = "v"

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file $1
cog check
"""

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]

# The core train: every package that shares the AST format, the generated glue, or the
# factory types. A commit touching any of them bumps them all together.
[monorepo.packages.core-train]
path = "."
changelog_path = "CHANGELOG.md"
include = [
    "packages/anatomy/**",
    "packages/core/**",
    "packages/css-adapter/**",
    "packages/css-lowering/**",
    "packages/js-effects/**",
    "packages/machines/**",
    "packages/material/**",
    "packages/panda-adapter/**",
    "packages/preset/**",
    "packages/rn-adapter/**",
    "packages/styling/**",
    "packages/tailwind-adapter/**",
    "packages/theme/**",
    "packages/type-utils/**",
    "packages/utils/**",
    "packages/binding-core/**",
    "packages/generate/**",
    # @anchor:new-core-train-package
]

# Bindings: their own version, peering on a core train range.
[monorepo.packages."@pureform/solid"]
path = "packages/solid"
include = ["packages/solid/**"]

# Tooling: internal, with its own versions.
[monorepo.packages."@pureform/oxfmt-config"]
path = "packages/oxfmt-config"
include = ["packages/oxfmt-config/**"]

[monorepo.packages."@pureform/oxlint-config"]
path = "packages/oxlint-config"
include = ["packages/oxlint-config/**"]

[monorepo.packages."@pureform/tsconfig"]
path = "packages/tsconfig"
include = ["packages/tsconfig/**"]

[monorepo.packages."@pureform/vite-config"]
path = "packages/vite-config"
include = ["packages/vite-config/**"]

[monorepo.packages."@pureform/vitest-config"]
path = "packages/vitest-config"
include = ["packages/vitest-config/**"]

[monorepo.packages."@pureform/release"]
path = "packages/release"
include = ["packages/release/**"]

[monorepo.packages."@pureform/react"]
path = "packages/react"
include = ["packages/react/**"]

#@anchor:new-typescript-package
