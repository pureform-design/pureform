# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/binding-core"

extends:
  - "@workspace/omni/presets/ts-vite-lib.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/core"
    - "@pureform/styling"
    - "@pureform/anatomy"

tasks:
  test:unit:
    enabled: true
    # The source type-checks without the DOM lib first (`tsconfig.json`), so a DOM type or API
    # fails here; then the specs, which run in Chromium, with it (`tsconfig.spec.json`).
    exec: bun run test:unit
    cache:
      key:
        files:
          append:
            - "./tsconfig*.json"

  test:integration:
    enabled: false

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: false

meta:
  publish: false
