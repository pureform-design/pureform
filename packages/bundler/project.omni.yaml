# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/bundler"

extends:
  - "@workspace/omni/presets/ts-vite-lib.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/anatomy"
    - "@pureform/binding-core"
    - "@pureform/core"
    - "@pureform/css-adapter"
    - "@pureform/generate"
    - "@pureform/preset"
    - "@pureform/styling"
    - "@pureform/styling-web"

cache:
  key:
    files:
      append:
        - client.d.ts
        - client-web.d.ts

tasks:
  test:unit:
    enabled: true

  test:integration:
    enabled: false

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: false

meta:
  publish: false
