# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/rn-adapter"

extends:
  - "@workspace/omni/presets/ts-vite-lib.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/core"
    - "@pureform/material"
    - "@pureform/preset"

tasks:
  test:unit:
    enabled: true

  test:integration:
    enabled: true

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: false

meta:
  publish: false
