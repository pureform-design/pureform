# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/react-native"

extends:
  - "@workspace/omni/presets/ts-vite-ui-lib.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/styling"
    - "@pureform/anatomy"
    - "@pureform/animate-react-native"
    - "@pureform/binding-core"
    - "@pureform/machines"
    - "@pureform/rn-adapter"
    - "@pureform/preset"
    - "@pureform/material"
    - "@pureform/theme"

tasks:
  test:unit:
    enabled: true
    cache:
      key:
        files:
          append:
            - "./vitest.config.browser.ts"

  test:integration:
    enabled: false

  test:component:
    enabled: true
    cache:
      key:
        files:
          append:
            - "./vitest.config.browser.ts"

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: true

meta:
  publish: true
