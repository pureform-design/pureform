# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/react-native"

extends:
  - "@workspace/omni/presets/ts-vite-lib.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/styling"
    - "@pureform/anatomy"
    - "@pureform/binding-core"
    - "@pureform/rn-adapter"
    - "@pureform/preset"

tasks:
  test:unit:
    enabled: true

  test:integration:
    enabled: false

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: true

meta:
  publish: true
