# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: "@pureform/anatomy"

extends:
  - "@workspace/omni/presets/ts-vite-lib.omni.yaml"

dependencies:
  append:
    - "@pureform/tsconfig"
    - "@pureform/vite-config"
    - "@pureform/vitest-config"
    - "@pureform/core"
    - "@pureform/preset"

tasks:
  test:unit:
    enabled: true

  test:integration:
    enabled: false

  test:
    enabled: true

  build:
    enabled: true

  publish:
    enabled: false

  # Rewrites src/generated.ts from the preset's components; run it after changing the preset.
  generate:
    exec: bun run generate
    cache:
      enabled: false

meta:
  publish: false
