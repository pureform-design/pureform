# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: ts-vite

extends:
  - "./ts.omni.yaml"

tasks:
  test:unit:
    exec: bun x vitest --config ./vitest.config.unit.ts run
    cache:
      key:
        files:
          append:
            - "./vite.config.ts"
            - "./vitest.config.unit.ts"
      output:
        files:
          - ".vitest/**/*"

  test:integration:
    exec: bun run vitest --config ./vitest.config.integration.ts run
    cache:
      key:
        files:
          append:
            - "./vite.config.ts"
            - "./vitest.config.integration.ts"
      output:
        files:
          - ".vitest/**/*"

  # Real components rendered in a browser: `src/**/*.component.{test,spec}.*`. Disabled until a
  # package has a `vitest.config.component.ts` and enables it.
  test:component:
    enabled: false
    exec: bun x vitest --config ./vitest.config.component.ts run
    # The components import the packages' built output.
    dependencies:
      - ^build
    cache:
      key:
        files:
          append:
            - "./vite.config.ts"
            - "./vitest.config.component.ts"
      output:
        files:
          - ".vitest/**/*"

  test:
    dependencies:
      append:
        - test:component

  build:
    exec: bun x vite build
    cache:
      key:
        files:
          append:
            - "./vite.config.ts"
