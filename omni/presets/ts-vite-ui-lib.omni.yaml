# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: ts-vite-ui-lib

extends:
  - "./ts-vite-lib.omni.yaml"

tasks:
  # Real components rendered in Chromium: `src/**/*.component.spec.*`, next to the component.
  # A package enables it and keeps its `vitest.config.component.ts` beside `vite.config.ts`.
  test:component:
    enabled: false
    exec: bun x vitest --config ./vitest.config.component.ts run
    # The components import the packages' built output.
    dependencies:
      - ^build
    cache:
      key:
        files:
          append:
            - "./vite.config.ts"
            - "./vitest.config.component.ts"
      output:
        files:
          - ".vitest/**/*"

  test:
    dependencies:
      append:
        - test:component

meta:
  ui: true
