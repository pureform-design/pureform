# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/project.json
name: ts

extends: ["./base.omni.yaml"]

cache:
  key:
    files:
      - "package.json"
      - "./src/**/*.{ts,tsx,js,jsx,cjs,mjs,mts,cts}"

tasks:
  test:unit:
    exec: bun run test:unit
    # Tests type-check against dependencies' built declarations, so build those first.
    dependencies:
      - ^build

  test:integration:
    exec: bun run test:integration
    dependencies:
      - test:unit

  test:
    exec: ""
    dependencies:
      - ^test
      - test:unit
      - test:integration

  build:
    exec: bun run build
    dependencies:
      - ^build
    cache:
      output:
        files:
          - dist/**/*

  check:format:
    exec: bun x oxfmt --check

  check:lint:
    # From the workspace root, so its config is the root one: its `options` (type-aware rules,
    # type checking, unused disable directives) apply only there, and a package's own config
    # (`packages/react`'s) is nested under it.
    exec: sh -c 'project="$PWD" && cd "$(git rev-parse --show-toplevel)" && bun x oxlint "$project"'
    # Type-aware rules and type checking resolve dependencies' built declarations, as
    # `check:types` does.
    dependencies:
      - ^build

  check:types:
    # Config files (vite, vitest, storybook, scripts) have their own tsconfig.node.json, when present.
    exec: sh -c 'bun x tsc --noEmit -p tsconfig.json && if [ -f tsconfig.node.json ]; then bun x tsc -p tsconfig.node.json; fi'
    # Resolves dependencies' built declarations.
    dependencies:
      - ^build
    cache:
      key:
        files:
          append:
            - "tsconfig*.json"
            - "*.config.ts"
            - "*.config.*.ts"
            - ".storybook/*.ts"
            - "scripts/**/*.ts"

  check:
    exec: ""
    dependencies:
      - ^check:fmt
      - ^check:lint
      - ^check:format

meta:
  language: typescript
