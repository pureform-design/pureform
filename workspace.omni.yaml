# yaml-language-server: $schema=https://raw.githubusercontent.com/omni-oss/json-schemas/refs/heads/main/workspace.json

ui: auto

projects:
  - packages/**
  - apps/**
  - tests/**

generators:
  - source: local
    path: omni/generators/**

projections:
  - source: local
    id: skills
    path: omni/projections/skills

ignore:
  files:
    - .gitignore
